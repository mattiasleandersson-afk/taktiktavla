<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taktiktavla TEST v602 JS-fetch-probe</title>
<style>
  body{margin:0;background:#111a14;color:#edf5ee;font-family:Arial,sans-serif;padding:18px;line-height:1.35}
  .box{max-width:780px;margin:0 auto;background:#16241b;border:1px solid #2d5a3a;border-radius:12px;padding:16px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
  h1{margin:0 0 10px;color:#ffcc00;font-size:1.25rem}
  button{background:#ffcc00;color:#111;border:0;border-radius:10px;padding:10px 14px;font-weight:900;font-size:1rem;margin:6px 6px 6px 0;cursor:pointer}
  pre{white-space:pre-wrap;word-break:break-word;background:#08100b;border:1px solid #29472f;border-radius:10px;padding:12px;min-height:130px;color:#d8ffe0}
  .warn{color:#ffcc00;font-weight:700}
</style>
</head>
<body>
<div class="box">
  <h1>TESTAPP v602 – JS-hämtning utan körning</h1>
  <p>Den här sidan testar bara om webbläsaren kan hämta <b>app_test_v599.js</b>. Den kör inte appkoden.</p>
  <p class="warn">Om denna kontroll fungerar vet vi att filen går att hämta. Om den fastnar här är problemet filhämtning/storlek/servering/cache.</p>
  <button id="btn-fetch">Testa hämta app_test_v599.js</button>
  <button id="btn-direct">Öppna JS-filen direkt</button>
  <pre id="out">Redo.</pre>
</div>
<script>
(function(){
  var out=document.getElementById('out');
  function log(msg){ out.textContent += '\n' + msg; }
  function set(msg){ out.textContent = msg; }
  var url='app_test_v599.js?v=602-fetch-probe-' + Date.now();
  document.getElementById('btn-direct').addEventListener('click',function(){
    window.open(url,'_blank');
  });
  document.getElementById('btn-fetch').addEventListener('click',async function(){
    set('Hämtar: '+url);
    var start=Date.now();
    var timer=setInterval(function(){
      var s=Math.round((Date.now()-start)/1000);
      out.textContent='Hämtar: '+url+'\nTid: '+s+' sekunder...';
    },1000);
    try{
      var res=await fetch(url,{cache:'no-store'});
      clearInterval(timer);
      log('HTTP status: '+res.status+' '+res.statusText);
      log('Content-Type: '+(res.headers.get('content-type')||'(saknas)'));
      var text=await res.text();
      log('Antal tecken: '+text.length);
      log('Första 300 tecken:\n'+text.slice(0,300));
      log('\nSista 300 tecken:\n'+text.slice(-300));
      if(text.indexOf('TESTMILJÖ')!==-1 || text.indexOf('v591')!==-1 || text.indexOf('v599')!==-1){
        log('\nMarkör hittad i JS: JA');
      }else{
        log('\nMarkör hittad i JS: NEJ');
      }
    }catch(e){
      clearInterval(timer);
      log('FEL: '+(e && (e.stack||e.message) || e));
    }
  });
})();
</script>
</body>
</html>
